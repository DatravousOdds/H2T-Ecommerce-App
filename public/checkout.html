<!DOCTYPE html>
<html lang="en">
  <head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D58F3PLGPS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D58F3PLGPS');

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/Hexxo_Bg_Removed.png" />
    <title>Hexxo : Checkout</title>
    <script src="https://js.stripe.com/dahlia/stripe.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="css/signup.css" /> -->
    <!-- <link rel="stylesheet" href="css/style2.css" /> -->
    <!-- <link rel="stylesheet" href="css/cart.css" /> -->
    <link rel="stylesheet" href="css/checkout.css" />
  </head>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />
  <body>
    <section id="header"></section>

    <div class="alert-box">
      <img src="/public/images/error.png" class="alert-img" alt="" />
      <p class="alert-msg"></p>
    </div>
    <div class="container-wrapper">
      <div class="shipping-payment">
        
        <div class="input-form">
          <h3 class="heading">Shipping Address</h3> 
          <div id="shippingInfo" class="shipping-info">
            <div class="skeleton skeleton-text" style="width: 50%"></div>
            <div class="skeleton skeleton-text" style="width: 80%"></div>
            <div class="skeleton skeleton-text" style="width: 65%"></div>
          </div>
          
        </div>

        <div class="input-form">
          <h2 class="heading">Payment Method</h2>
          <form id="payment-form">
            <div id="contact-details-element">
              <!--Stripe.js injects the Contact Details Element-->
            </div>
            <div id="shipping-to-section">
              <h4>Shipping To</h4>
              <div id="shipping-address-element">
                <!--Stripe.js injects the destination Address Element-->
              </div>
            </div>
            <h4>Billing Address</h4>
            <div id="billing-address-element">
              <!--Stripe.js injects the Address Element-->
            </div>
            <h4>Payment</h4>
            <div id="payment-element">
              <!--Stripe.js injects the Payment Element-->
            </div>
          </form>
        </div>
        
        
      </div>
      <div class="cart-section">
        <div class="product-list">
          <h3 class="heading">Order Details</h3>
          <div class="cart">
            <div class="cart-item">
              <div class="product-info-wrapper">
                <div class="skeleton skeleton-img"></div>
               <div class="cart-item-info">
                 <div class="cart-product-info">
                   <div class="skeleton skeleton-text" style="width: 40%"></div>
                   <div class="skeleton skeleton-text" style="width: 70%"></div>
                   <div class="skeleton skeleton-text" style="width: 30%"></div>
                   <div class="skeleton skeleton-text" style="width: 25%"></div>
                 </div>
               </div>
               </div>
              <div class="seller-profile">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton skeleton-text" style="width: 100px"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="checkout-section">
          <div class="checkout-box" id="checkoutBox">
            <h3>Order Summary</h3>
            <div class="line-item-container">
              <div class="skeleton skeleton-text" style="width: 35%"></div>
              <div class="skeleton skeleton-text" style="width: 20%"></div>
            </div>
            <div class="line-item-container">
              <div class="skeleton skeleton-text" style="width: 35%"></div>
              <div class="skeleton skeleton-text" style="width: 20%"></div>
            </div>
            <div class="line-item-container">
              <div class="skeleton skeleton-text" style="width: 35%"></div>
              <div class="skeleton skeleton-text" style="width: 20%"></div>
            </div>
            <div class="line-item-container">
              <div class="skeleton skeleton-text" style="width: 35%"></div>
              <div class="skeleton skeleton-text" style="width: 20%"></div>
            </div>
            <hr>
            <div class="line-item-container">
              <div class="skeleton skeleton-text" style="width: 25%"></div>
              <div class="skeleton skeleton-text" style="width: 30%"></div>
            </div>
            <div class="skeleton skeleton-button"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/commerce/checkout.js"></script>
  </body>
</html>
