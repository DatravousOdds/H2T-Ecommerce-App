<!-- ============================================ -->
            <!-- Trading Cards Form -->
            <!-- ============================================ -->
            <div class="form-wrapper" id="trading-cards-form" data-category="trading cards" style="display: block;">
              <div class="form-input" data-screen="brand">
                <label id="card-brand-picker-label" for="card-brand-search">Brand</label>

                <!-- Closed list (TRADING_CARD_BRANDS, from public/js/core/catalogData.json).
                     The game or league is the brand. Rendered as cards by
                     initBrandCardPicker(); the clicked brand is written into the hidden
                     #card-brand input, which validation and draft restore read. -->
                <div class="brand-picker" id="card-brand-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="card-brand-search"
                      class="brand-search-input input-bordered input-width-full"
                      placeholder="Search brand or game"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="card-brand-options"></div>
                </div>

                <input type="hidden" id="card-brand" name="brand" />
              </div>

              <!-- Card name, year, card number, edition, condition/grade and grading company are
                   intentionally not collected -- the AI detects them from the photos. Model is
                   the kind of product (Graded Singles, Booster Box...), filled per brand by
                   initBrandModelToggle() from the curated lists in catalogData.json (there is no
                   live source for cards); a brand with no model list has no Model field, so it
                   stays hidden until one exists. -->
              <div class="form-input-row" id="card-model-field" style="display: none" data-screen="model">
                <div class="form-input">
                  <label for="card-model-search">Model</label>
                  <div class="brand-picker" id="card-model-picker">
                    <div class="brand-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="card-model-search"
                        class="brand-search-input input-bordered input-width-full"
                        placeholder="Search model"
                        autocomplete="off"
                      />
                    </div>

                    <div class="brand-option-list" id="card-model-options"></div>
                  </div>
                  <input type="hidden" id="card-model" name="model" />
                </div>
              </div>
            </div>
