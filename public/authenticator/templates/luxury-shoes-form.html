<!-- ============================================ -->
            <!-- Luxury Shoes Form (Designer / Collab Footwear) -->
            <!-- ============================================ -->
            <div class="form-wrapper" id="luxury-shoes-form" data-category="luxury-shoes" style="display: block;">
              <div class="form-input" data-screen="brand">
                <label id="luxury-shoes-brand-picker-label" for="luxury-shoes-brand-search">Brand</label>

                <!-- Closed list (LUXURY_SHOES_BRANDS in authenticate.js) -- these are the only
                     brands Hexxo currently authenticates luxury/collab shoes for. Jordan and Nike
                     are here specifically for their designer collabs (Dior, Off-White, Louis
                     Vuitton, Air Yeezy, NikeCraft) -- everyday Jordan/Nike releases go under the
                     plain Sneakers category instead. Rendered as cards by initBrandCardPicker();
                     the clicked brand is written into the hidden #luxury-shoes-brand input,
                     which validation and draft restore read. -->
                <div class="brand-picker" id="luxury-shoes-brand-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="luxury-shoes-brand-search"
                      class="brand-search-input input-bordered input-width-full"
                      placeholder="Search brand"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="luxury-shoes-brand-options"></div>
                </div>

                <input type="hidden" id="luxury-shoes-brand" name="brand" />
              </div>

              <!-- Size, color and condition are intentionally not collected -- the AI detects
                   them from the photos. Model is filled per brand by initBrandModelToggle():
                   Jordan and Nike from their curated collab list (LUXURY_SHOES_MODELS_BY_BRAND),
                   every other brand live from KicksDB. The field stays hidden until a list
                   exists for the chosen brand. -->
              <div class="form-input-row" id="luxury-shoes-model-field" style="display: none" data-screen="model">
                <div class="form-input">
                  <label for="luxury-shoes-model-search">Model <span class="required">*</span></label>
                  <div class="brand-picker" id="luxury-shoes-model-picker">
                    <div class="brand-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="luxury-shoes-model-search"
                        class="brand-search-input input-bordered input-width-full"
                        placeholder="Search model"
                        autocomplete="off"
                      />
                    </div>

                    <div class="brand-option-list" id="luxury-shoes-model-options"></div>
                  </div>
                  <input type="hidden" id="luxury-shoes-model" name="model" />
                </div>
              </div>
            </div>
