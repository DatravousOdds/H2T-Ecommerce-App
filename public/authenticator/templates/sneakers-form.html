<!-- Sneakers Form (Your Original) -->
            <div class="form-wrapper" id="sneakers-form" data-category="sneaker" style="display: block;">
              <div class="form-input">
                <label id="sneaker-brand-picker-label" for="sneaker-brand-search">Choose a brand <span class="required">*</span></label>

                <!-- Custom picker, not a native <select> -- initSneakerBrandPicker() in
                     authenticate.js renders the brand buttons and filters them against the
                     search box. Whichever brand is clicked is written into the hidden
                     #sneaker-brand input below, which is the only thing the rest of the
                     form (collectProductData, validateForm, draft save/restore) reads. -->
                <div class="brand-picker" id="sneaker-brand-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="sneaker-brand-search"
                      class="brand-search-input"
                      placeholder="Search brand"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="sneaker-brand-options"></div>
                </div>

                <input type="hidden" id="sneaker-brand" name="brand" />
              </div>

              <div class="form-input">
                <label id="sneaker-model-picker-label" for="sneaker-model-search">Choose a model</label>

                <!-- Same button+search widget as the brand picker above, but as a
                     standalone second field rather than a drill-down within Brand --
                     Brand stays captured in #sneaker-brand regardless of what's picked
                     here. Options come from SNEAKER_MODELS_BY_BRAND[currently selected
                     brand], which is empty for every brand today, so this renders an
                     empty state until per-brand model lists are added. Not marked
                     required for that reason -- see initSneakerModelPicker() in
                     authenticate.js. -->
                <div class="brand-picker" id="sneaker-model-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="sneaker-model-search"
                      class="brand-search-input"
                      placeholder="Search model"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="sneaker-model-options"></div>
                </div>

                <input type="hidden" id="sneaker-model" name="model" />
              </div>
            </div>
