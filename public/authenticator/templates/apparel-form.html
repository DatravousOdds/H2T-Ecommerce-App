<!-- ============================================ -->
            <!-- Apparel Form -->
            <!-- ============================================ -->
            <div class="form-wrapper" id="apparel-form" data-category="apparel" style="display: block;">
              <div class="form-input" data-screen="brand">
                <label id="apparel-brand-picker-label" for="apparel-brand-search">Brand</label>

                <!-- Closed list (APPAREL_BRANDS, from public/js/core/catalogData.json) -- these
                     are the only brands Hexxo currently authenticates apparel for. Rendered as
                     cards by initBrandCardPicker(); the clicked brand is written into the hidden
                     #apparel-brand input, which validation and draft restore read. -->
                <div class="brand-picker" id="apparel-brand-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="apparel-brand-search"
                      class="brand-search-input input-bordered input-width-full"
                      placeholder="Search brand"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="apparel-brand-options"></div>
                </div>

                <input type="hidden" id="apparel-brand" name="brand" />
              </div>

              <!-- Item type, size, condition, color, material and style are intentionally not
                   collected -- the AI detects them from the photos. Model is filled per brand
                   by initBrandModelToggle() from the server's cached list; the field stays
                   hidden until a list exists for the chosen brand. -->
              <div class="form-input-row" id="apparel-model-field" style="display: none" data-screen="model">
                <div class="form-input">
                  <label for="apparel-model-search">Model <span class="required">*</span></label>
                  <div class="brand-picker" id="apparel-model-picker">
                    <div class="brand-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="apparel-model-search"
                        class="brand-search-input input-bordered input-width-full"
                        placeholder="Search model"
                        autocomplete="off"
                      />
                    </div>

                    <div class="brand-option-list" id="apparel-model-options"></div>
                  </div>
                  <input type="hidden" id="apparel-model" name="model" />
                </div>
              </div>
            </div>
