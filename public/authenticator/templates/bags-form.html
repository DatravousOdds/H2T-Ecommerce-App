<!-- ============================================ -->
            <!-- Bags & Leather Goods Form -->
            <!-- ============================================ -->
            <div class="form-wrapper" id="bags-form" data-category="bags" style="display: block;">
              <div class="form-input" data-screen="brand">
                <label id="bags-brand-picker-label" for="bags-brand-search">Brand</label>

                <!-- Closed list (BAGS_BRANDS in authenticate.js) -- these are the only brands
                     Hexxo currently authenticates bags & leather goods for. Rendered as cards
                     by initBrandCardPicker(); the clicked brand is written into the hidden
                     #bags-brand input, which keeps the old select's id so validation,
                     draft restore and initBrandModelToggle() work unchanged. -->
                <div class="brand-picker" id="bags-brand-picker">
                  <div class="brand-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                      type="text"
                      id="bags-brand-search"
                      class="brand-search-input input-bordered input-width-full"
                      placeholder="Search brand"
                      autocomplete="off"
                    />
                  </div>

                  <div class="brand-option-list" id="bags-brand-options"></div>
                </div>

                <input type="hidden" id="bags-brand" name="brand" />
              </div>

              <!-- Model is filled per brand by initBrandModelToggle(): Hermès from its curated
                   list (public/js/core/catalogData.json), every other brand from the server's
                   cached list. The field stays hidden until a list exists for the chosen
                   brand. The clicked model is written into the hidden #bags-model input, which
                   stays in the DOM permanently so validation and draft restore always find it. -->
              <div class="form-input-row" id="bags-model-field" style="display: none" data-screen="model">
                <div class="form-input">
                  <label for="bags-model-search">Model <span class="required">*</span></label>
                  <div class="brand-picker" id="bags-model-picker">
                    <div class="brand-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="bags-model-search"
                        class="brand-search-input input-bordered input-width-full"
                        placeholder="Search model"
                        autocomplete="off"
                      />
                    </div>

                    <div class="brand-option-list" id="bags-model-options"></div>
                  </div>
                  <input type="hidden" id="bags-model" name="model" />
                </div>
              </div>
            </div>
