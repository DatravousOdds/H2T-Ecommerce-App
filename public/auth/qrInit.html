<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/main.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script
      src="https://kit.fontawesome.com/854f8a6196.js"
      crossorigin="anonymous"
    ></script>
    <title>QR CODE</title>
</head>
<body>
    <main class="qr-layout">
        <div class="mod show">
            <div id="qrWrapper" class="qr-wrapper modal-box">
                <div class="modal-content text-center">
                    <div id="loaderSlot" class="loader-slot"></div>
                    <h1 class="text-upper lh-loose">Checking your code</h1>
                    <p class="subheading">Matching QR code to Hexxo rewards</p>
                    <hr />
                    <p class="text-upper redeem-text">Code <span id="codeInput"></span></p>
                </div>
            </div>   
        </div>
        
    </main>
    <footer></footer>
    <script type="module" src="../js/pages/qrInit.js"></script>
</body>
</html>
