<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/Hexxo_Bg_Removed.png" />
    <title>Hexxo : Create Account</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/signup.css" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="login-page-layout">
      <img src="images/loader.gif" class="loader" alt="" />

      <div class="alert-box">
        <img src="images/error.png" class="alert-img" alt="" />
        <p class="alert-msg">Error message</p>
      </div>

      <div class="content-block login-form">
        <a class="content-header" href="/"><img src="../images/image1.svg" class="logo" alt="" /></a>
        <div class="signup-form">
          <input type="text" autocomplete="off" id="name" placeholder="Enter your name" />
          <input type="email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" id="email" placeholder="Enter your email" />
          <input
            type="password"
            autocomplete="off"
            id="password"
            placeholder="Enter password"
          />
          <input
            type="text"
            autocomplete="off"
            id="number"
            placeholder="Enter your phone number"
          />
          <input type="checkbox" checked class="checkbox" id="terms-and-cond" />
          <label for="terms-and-cond"
            >agree to our <a href="/terms">terms and conditions</a></label
          >
          <br />
          <input type="checkbox" class="checkbox" id="notification" />
          <label for="notification"
            >receive upcoming offers and events mails</label
          >
          <button class="btn btn-primary" id="submitBtn">Register</button>
        </div>
        <a href="/login" class="link">Already have an account?
          <span class="login-link">Log in here</span></a>

      </div>
    </main>

    <script src="js/core/token.js"></script>
    <script type="module" src="js/auth/auth.js"></script>
  </body>
</html>
