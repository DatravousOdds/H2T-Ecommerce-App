<!DOCTYPE html>
<html>
  <head>
  <!-- Google tag (gtag.js), skipped when the browser sends Global Privacy Control -->
  <script type="module" src="/js/core/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/signup.css" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/Hexxo_Bg_Removed.png" />
    <title>Hexxo : Log In</title>
  </head>
  <body>

    <main class="login-page-layout auth-page">
      <img src="images/loader.gif" class="loader" alt="" />

      <div class="alert-box">
        <img src="images/error.png" class="alert-img" alt="" />
        <p class="alert-msg">Error message</p>
      </div>

      <div class="content-block login-form login-card">
        <div class="login-header">
          <img class="logo" src="../images/Hexxo_Bg_Removed.png" alt="Hexxo">
          <h1>Welcome back</h1>
          <!-- class="link" + href="/signup" is what auth.js matches to carry ?returnTo across -->
          <p class="login-sub">New to Hexxo? <a href="/signup" class="link">Create an account</a></p>
        </div>
        <!-- Source order is the tab order: email, password, Show, Log in, Forgot.
             CSS grid lifts "Forgot password?" up beside the label on desktop. -->
        <div class="input-layout login-fields">
          <label for="email">Email</label>
          <input type="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" id="email" placeholder="you@example.com" />
          <label for="password" class="password-label">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              autocomplete="current-password"
              id="password"
              placeholder="Enter your password"
            />
            <button type="button" class="password-toggle" id="togglePassword" aria-pressed="false">Show</button>
          </div>
          <button class="btn btn-primary btn-width-full" id="submitBtn">Log in</button>
          <a href="/forgot-password" class="forgot-password-link">Forgot password?</a>
        </div>
      </div>
      <p class="login-legal">By logging in you agree to Hexxo's <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
    </main>

    <script src="js/core/token.js"></script>
    <script type="module" src="js/auth/auth.js"></script>
  </body>
</html>
