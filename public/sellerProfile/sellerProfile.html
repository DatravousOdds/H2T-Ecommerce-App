<!DOCTYPE html>
<html lang="en">
  <head>
  <!-- Google tag (gtag.js), skipped when the browser sends Global Privacy Control -->
  <script type="module" src="/js/core/analytics.js"></script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/Hexxo_Bg_Removed.png" />
    <title>Hexxo : Seller Profile</title>
    <script
      src="https://kit.fontawesome.com/854f8a6196.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/style2.css" />
    <link rel="stylesheet" href="../css/components/pageLoader.css" />
    <link rel="stylesheet" href="../css/components/skeleton.css" />
    <link rel="stylesheet" href="../css/components/newsletter.css" />
    <link rel="stylesheet" href="../css/components/cartDrawer.css" />
    <link rel="stylesheet" href="../css/pages/sellerProfile.css" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  </head>

  <body>
    <!-- Navbar -->
    <section id="header">
      <nav></nav>
    </section>
    <!-- End of Navbar -->

    <main class="home-page-layout">
    <section class="seller-header section-p1">
      <!-- Branded gradient by default; swapped for the seller's own banner
           image when the profile has one (see renderSellerHeader). -->
      <div class="seller-banner" id="seller-banner"></div>

      <div class="seller-identity-row">
        <img src="/images/default-avatar.svg" alt="" class="seller-avatar" id="seller-picture" />

        <div class="seller-actions">
          <a class="seller-secondary-btn" id="view-offers-link" href="#" style="display: none">View Offers</a>
          <!-- Starts disabled as a neutral placeholder: whether the viewer
               already follows this seller isn't known until init resolves it,
               so it must not claim "Follow" or accept clicks before then. -->
          <button type="button" class="follow-btn is-pending" id="follow-btn" aria-pressed="false" aria-busy="true" disabled>Follow</button>
        </div>
      </div>
      <p class="follow-error" id="follow-error" role="alert" hidden></p>

      <div class="seller-header-info">
        <div class="seller-username-row">
          <h1 class="seller-username" id="seller-username">
            <span class="skeleton skeleton-line medium"></span>
          </h1>
          <div class="verified-tag" id="verified-tag" title="Verified seller on Hexxo" style="display: none">
            <img src="../images/badge-verified-solid-shield.svg" alt="" class="verified-badge-icon" />
            Verified
          </div>
          <div class="verified-tag" id="trusted-tag" title="Trusted seller on Hexxo" style="display: none">
            <img src="../images/shield-logo.svg" alt="" class="verified-badge-icon" />
            Trusted
          </div>
        </div>

        <div class="seller-rating-row" id="seller-rating-stat" style="display: none">
          <span class="seller-rating-stars" id="seller-rating-stars"></span>
          <span id="seller-rating"></span>
        </div>

        <p class="seller-bio" id="seller-bio" hidden></p>

        <ul class="seller-stats" aria-label="Seller stats">
          <!-- "–" until real numbers arrive, so nothing reads as a real 0. -->
          <li><strong id="seller-listings-count">–</strong> <span>Listings</span></li>
          <li><strong id="seller-sold-count">–</strong> <span>Sold</span></li>
          <li><strong id="seller-followers-count">–</strong> <span>Followers</span></li>
          <li><strong id="seller-following-count">–</strong> <span>Following</span></li>
        </ul>

        <div class="seller-website-links" id="seller-website-links" style="display: none"></div>
      </div>
    </section>

    <section class="seller-not-found section-p1" id="seller-not-found" hidden>
      <div class="seller-listings-state" role="alert">
        <i class="fa-solid fa-user-slash" aria-hidden="true"></i>
        <h1>This seller isn't available</h1>
        <p>The profile may have been removed, or we couldn't load it. Check the link and try again.</p>
        <a class="seller-secondary-btn" href="/">Back to home</a>
      </div>
    </section>

    <section class="seller-listings-section section-p1" id="seller-listings-section">
      <div class="seller-listings-heading">
        <h2 class="seller-listings-header">Listings</h2>
        <!-- The buyer is never charged for shipping (a prepaid label's rate
             comes out of the seller's payout -- see purchaseShippingLabel in
             server.js), so this is stated once here instead of on every tile. -->
        <span class="seller-listings-note"><i class="fa-solid fa-truck-fast" aria-hidden="true"></i> Free shipping on every item</span>
      </div>
      <div class="seller-listings-grid" id="seller-listings-grid"></div>
    </section>
    </main>

    <!-- Newsletter -->
    <section id="newsletter"></section>

    <footer></footer>

    <div class="cart-drawer" id="cartDrawer" aria-modal="true" role="dialog" aria-label="Cart">
    </div>
    <div class="cart-drawer-backdrop" id="cartBackdrop"></div>

    <script type="module" src="../js/pages/sellerProfile.js"></script>
    <script type="module" src="../js/components/newsletter.js"></script>
    <script type="module" src="../js/components/nav.js"></script>
    <script type="module" src="../js/components/footer.js"></script>
  </body>
</html>
