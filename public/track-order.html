<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D58F3PLGPS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D58F3PLGPS');

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/Hexxo_Bg_Removed.png" />
    <title>Hexxo : Track Order</title>
    <link rel="modulepreload" href="js/components/nav.js">
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style2.css" />
    <link rel="stylesheet" href="css/components/newsletter.css" />
    <link rel="stylesheet" href="css/components/cartDrawer.css" />
    <link rel="stylesheet" href="css/components/skeleton.css" />
    <link rel="stylesheet" href="css/pages/trackOrder.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/854f8a6196.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="header">
      <nav></nav>
    </section>

    <main class="track-order-wrapper">
      <div class="track-order-header">
        <h1>Track Order</h1>
        <p class="order-id-note"><i class="fa-solid fa-cube"></i> Order #<span id="orderIdShort">--</span></p>
      </div>

      <p class="track-order-error" id="trackOrderError" style="display: none;"></p>

      <section class="track-order-section" id="timelineSection" style="display: none;">
        <h2>Product in Transit</h2>
        <div class="order-timeline" id="orderTimeline"></div>
      </section>

      <div class="track-order-columns" id="trackOrderColumns" style="display: none;">
        <div class="track-order-left">
          <section class="track-order-section">
            <h2>Order Summary</h2>
            <div class="order-summary-card" id="orderSummaryCard"></div>
          </section>

          <section class="track-order-section">
            <h2>Need Help?</h2>
            <a class="message-seller-link" id="messageSellerLink" href="/contact">
              <i class="fa-regular fa-comment-dots"></i>
              Message Seller
            </a>
          </section>
        </div>

        <div class="track-order-right">
          <section class="track-order-section">
            <h2>Order Details</h2>
            <div class="order-price-breakdown" id="orderPriceBreakdown"></div>
          </section>
        </div>
      </div>

      <!-- Skeleton placeholder shown while trackOrder.js fetches -->
      <div class="track-order-skeleton" id="trackOrderSkeleton">
        <div class="order-timeline-skeleton">
          <span class="skeleton skeleton-line long"></span>
        </div>
        <div class="track-order-columns">
          <div class="track-order-left">
            <span class="skeleton skeleton-line long" style="height: 120px;"></span>
          </div>
          <div class="track-order-right">
            <span class="skeleton skeleton-line long" style="height: 180px;"></span>
          </div>
        </div>
      </div>
    </main>

    <!-- newsletter -->
    <section id="newsletter" class="section-p1"></section>

    <footer></footer>

    <script type="module" src="js/commerce/trackOrder.js"></script>
    <script type="module" src="js/components/nav.js"></script>
    <script type="module" src="js/components/newsletter.js"></script>
    <script type="module" src="js/components/footer.js"></script>
</body>
</html>
